<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakub Kaczor - Unreal Engine Developer</title>
  <meta name="description" content="Jakub Kaczor builds gameplay systems in Unreal Engine 5 with C++. Portfolio of shipped prototypes - open to junior roles and internships.">
  <link rel="icon" href="icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "c18e3a8318b549cfb29e25c573e2d18f"}'></script>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="#" class="logo" id="site-logo">JK</a>
      <nav>
        <ul class="nav-links">
          <li><a href="#work" data-label="navWork">Work</a></li>
          <li><a href="#about" data-label="navAbout">About</a></li>
          <li><a href="#contact" class="nav-cta" data-label="navContact">Hire Me</a></li>
        </ul>
      </nav>
      <div class="nav-right">
        <div class="lang-toggle">
          <button id="lang-en" class="lang-btn" aria-label="English">EN</button>
          <button id="lang-pl" class="lang-btn" aria-label="Polski">PL</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-layout">
        <div class="hero-content reveal">
          <p class="hero-availability" id="hero-availability"></p>
          <h1 id="hero-headline"></h1>
          <p class="hero-tagline" id="hero-tagline"></p>
          <p class="hero-role"><span id="hero-name"></span> — <span id="hero-role"></span></p>
          <div class="hero-actions">
            <a href="#work" class="btn btn-primary" data-label="heroCtaWork">See my work</a>
            <a href="#contact" class="btn btn-outline" data-label="heroCtaContact">Get in touch</a>
          </div>
          <div class="stats" id="stats-row"></div>
        </div>
        <div class="hero-visual reveal">
          <div class="photo-frame">
            <img id="hero-photo" src="images/photo.jpg" alt="Jakub Kaczor">
          </div>
        </div>
      </div>
    </section>

    <section id="work" class="section">
      <div class="container">
        <div class="section-intro reveal">
          <span class="section-label" data-label="sectionWork">Selected Work</span>
          <p class="section-sub" data-label="sectionWorkSub"></p>
        </div>
        <div id="featured-project" class="reveal"></div>
        <div id="projects-list" class="projects-list"></div>
      </div>
    </section>

    <section id="capabilities" class="section section-alt">
      <div class="container">
        <div class="section-intro reveal">
          <span class="section-label" data-label="sectionCapabilities">What I Bring</span>
        </div>
        <div class="capabilities-grid" id="capabilities-grid"></div>
        <div class="skills-cloud reveal" id="skills-cloud"></div>
      </div>
    </section>

    <section id="about" class="section">
      <div class="container about-layout reveal">
        <div class="about-text">
          <span class="section-label" data-label="sectionAbout">About</span>
          <p id="about-bio"></p>
          <blockquote class="about-quote" id="about-looking"></blockquote>
        </div>
      </div>
    </section>

    <section id="contact" class="section contact-section">
      <div class="container contact-box reveal">
        <span class="section-label" data-label="sectionContact">Let's Work Together</span>
        <p class="contact-sub" data-label="sectionContactSub"></p>
        <a id="contact-email" class="contact-email" href="mailto:j.kaczor06@gmail.com"></a>
        <div class="contact-actions">
          <a id="cv-en" href="JakubKaczor_Resume.pdf" download class="btn btn-primary" data-label="cvEn">Resume (English)</a>
          <a id="cv-pl" href="JakubKaczor_CV.pdf" download class="btn btn-outline" data-label="cvPl">CV (Polish)</a>
        </div>
        <div class="social-links" id="social-links"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span>&copy; <span id="footer-year"></span> Jakub Kaczor</span>
      <span class="footer-note">Built with UE5 passion</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("footer-year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
